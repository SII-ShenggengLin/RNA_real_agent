name: rnastop_service_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pip:
      - fastapi
      - uvicorn
      - pydantic
      - transformers==4.34.0
      - tokenizers==0.14.1
      - safetensors==0.3.3
      - ViennaRNA
      - rna-fm
