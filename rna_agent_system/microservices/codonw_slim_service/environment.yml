# CodonW-slim: codon usage / CAI / Nc metrics (C extension via Cython).
# Submodule: rna_agent_system/external_repos/codonw-slim
#
# Create env (FastAPI stack only; codonw-slim is installed in a second step):
#   cd rna_agent_system/microservices/codonw_slim_service
#   conda env create -f environment.yml
#   conda activate codonw_slim_service_env
#   bash install_codonw_slim.sh
#   bash start.sh
#
# Why install_codonw_slim.sh: ``conda`` invokes ``pip`` in an isolated build environment
# for ``-e`` installs; codonw-slim's setup.py imports Cython before deps exist there.
# ``pip install --no-build-isolation`` uses this env's conda-provided Cython/numpy.

name: codonw_slim_service_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
  - numpy>=1.23,<2.3
  - pandas>=1.5
  - cython>=0.29.36
  - pip:
    - fastapi==0.104.1
    - uvicorn[standard]==0.24.0
    - pydantic==2.5.0
