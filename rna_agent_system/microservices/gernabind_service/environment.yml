name: gernabind_service_env
channels:
  - pytorch
  - nvidia
  - rdkit
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - fastapi=0.95.2
  - pydantic=1.10.13
  - uvicorn=0.22.0
  - requests
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - networkx
  - biopython
  - tqdm
  - rdkit
  - pytorch=2.1.*
  - torchvision=0.16.*
  - torchaudio=2.1.*
  - pytorch-cuda=11.8
  - pip:
      - viennarna==2.6.4
      - rna-fm==0.2.2
      - equiformer-pytorch
      - edl-pytorch==0.0.2
