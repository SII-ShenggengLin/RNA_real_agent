[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: live microservices or network; skip with: pytest -m "not integration"
    live_llm: tests that call a live LLM API; skip unless --live-llm flag is passed
    slow: tests that take >10s (API calls, model loading, heavy computation); skip with: pytest -m "not slow"
    gpu: tests that require a CUDA GPU; skip with: pytest -m "not gpu"
    known_issue: tests with known upstream/environment issues; skip with: pytest -m "not known_issue"

# Default fast test run: excludes integration, live_llm, slow, and known_issue
addopts = -m "not integration and not live_llm and not slow and not known_issue"
